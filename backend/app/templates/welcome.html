<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Estudio - Socius</title>
  <link rel="stylesheet" href="/css/welcomeStyle.css">
</head>
<body>

  <div class="card">
    <h2>Estudio Psicométrico Socius</h2>
    <p class="subtitle">Selecciona una opción para continuar con tu sesión.</p>

    <!-- Botones de selección de modo -->
    <div id="modeSelector" class="mode-selector">
      <button type="button" id="btnNew" class="btn-submit" onclick="showNewForm()">Nuevo Participante</button>
      <button type="button" id="btnReturning" class="btn-submit btn-secondary" onclick="showReturningForm()">Ya tengo pseudónimo</button>
    </div>

    <!-- Formulario para Nuevo Usuario -->
    <form id="newParticipantForm" class="hidden-form" novalidate>
      <div class="pseudonym-box">
        <small class="pseudonym-label">Tu pseudónimo asignado:</small>
        <span id="pseudonymText">Generando...</span>
      </div>

      <div class="form-group">
        <label for="age">Edad:</label>
        <input
          type="number"
          id="age"
          name="age"
          min="17"
          max="120"
          step="1"
          inputmode="numeric"
          required
          onkeydown="if (['e', 'E', '+', '-', '.'].includes(event.key)) event.preventDefault();"
          oninput="this.value = this.value.replace(/[^0-9]/g, '');"
          placeholder="Ej. 25"
        >
      </div>

      <div class="form-group">
        <label for="gender">Género:</label>
        <select id="gender" name="gender" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="Hombre">Hombre</option>
          <option value="Mujer">Mujer</option>
          <option value="No binario">No binario</option>
          <option value="Prefiero no decirlo">Prefiero no decirlo</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-submit btn-secondary" onclick="goBack()">Volver</button>
        <button type="submit" id="submitNewBtn" class="btn-submit" disabled>Registrarse y Comenzar</button>
      </div>
    </form>

    <!-- Formulario para Usuario Recurrente -->
    <form id="returningForm" class="hidden-form">
      <div class="form-group">
        <label for="existingPseudonym">Ingresa tu pseudónimo (Ej. LOBO AZUL):</label>
        <input type="text" id="existingPseudonym" name="existingPseudonym" class="uppercase-input" required placeholder="ANIMAL COLOR">
      </div>
      <div class="form-actions">
        <button type="button" class="btn-submit btn-secondary" onclick="goBack()">Volver</button>
        <button type="submit" class="btn-submit">Continuar Sesión</button>
      </div>
    </form>
  </div>
  <script src="/js/welcomejs.js"></script>
</body>
</html>
