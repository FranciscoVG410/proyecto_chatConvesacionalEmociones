<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCIUS PULSE</title>
    <link rel="icon" type="image/png" href="imgs/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/dashStyle.css">
    <!-- Plugin de anotaciones para rellenar cuadrantes/zonas -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="main-header">
        <img src="imgs/sociuspulsenew.png" alt="Socius - Monitoreo Emocional VAD">
    </header>

    <!-- CONTENEDOR DE PANELES -->
    <div class="dashboard-container">
        
        <!-- PANEL DE TELEMETRÍA -->
        <div class="panel panel-left">
            <img src="imgs/purpletele.png" alt="Telemetría VAD" class="panel-left-img">
            
            <div class="card">
                <small>Último mensaje:</small>
                <div id="txt-prompt" class="prompt-text">Esperando datos...</div>
            </div>
            <div class="card">
                <small>Emoción Predominante:</small>
                <div id="txt-emotion" class="val">---</div>
            </div>
            <div class="card">
                <small>Coordenadas (Valence, Arousal, Dominance):</small>
                <div id="txt-coords" class="val">V: 0.00 | A: 0.00 | D: 0.00</div>
            </div>
            <div class="card">
                <small>Distancia a Serenidad:</small>
                <div id="txt-distance" class="val">0.00</div>
            </div>
            <div class="report-action">
                <button id="btn-generate-report" class="btn-report" onclick="goToReport()">
                    GENERAR REPORTE
                </button>
            </div>
        </div>

        <!-- PANEL DE LA GRÁFICA -->
        <div class="panel panel-right">
            <img src="imgs/purpletrayecto.png" alt="Socius" class="panel-right-img">
            
            <!-- SWITCH DE CAMBIO DE VISTA (2D / 3D) -->
            <div class="view-toolbar">
                <span class="view-label">Modo de Vista:</span>
                <button id="btn-toggle-view" class="btn-view-toggle" onclick="toggleViewMode()">
                    Vista: Cubo 3D
                </button>
            </div>

            <div class="chart-container">
                <canvas id="vadChart"></canvas>
                
                <!-- SIMBOLOGÍA DE LA GRÁFICA -->
                <div id="legend-box" class="legend-box">
                    <div class="legend-title">Simbología VAD</div>
                    <div class="legend-item">
                        <span class="legend-dot legend-dot--active"></span>
                        <span>Último Punto (Activo)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot legend-dot--previous"></span>
                        <span>Puntos Anteriores</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot legend-dot--critical"></span>
                        <span>Punto Crítico (Alerta)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-line legend-line--path"></span>
                        <span>Trayectoria</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-line legend-line--guide"></span>
                        <span>Líneas Guía (Ejes)</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="/frontend/js/dashboardjs.js"></script>
</body>
</html>
