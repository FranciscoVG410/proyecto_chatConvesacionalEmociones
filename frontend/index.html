<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOCIUS</title>
    <link rel="icon" type="image/png" href="imgs/logo.png">
    <link rel="stylesheet" href="css/indexStyle.css">
</head>
<body>

    <header>
        <img src="imgs/purplesocius.png" alt="Socius">
    </header>

    <div class="chat-box">
        <div class="chat-header">
            <span class="chat-title">Socius Assistant</span>
            <div class="status-badge">
                <span class="status-dot"></span> En vivo
            </div>
        </div>
        
        <div class="messages" id="msgs">
            <div class="msg bot">
                Hola, bienvenido a Socius. Estoy aquí para acompañarte. ¿De qué te gustaría hablar hoy?
                
                <!-- OPCIONES DE INICIO RÁPIDO -->
                <div class="quick-prompts">
                    <div class="prompt-card" onclick="sendQuick('Me siento algo estresado hoy')">
                        Me siento algo estresado hoy
                    </div>
                    <div class="prompt-card" onclick="sendQuick('Quiero hablar sobre mi jornada de trabajo')">
                        Quiero hablar sobre mi jornada de trabajo
                    </div>
                    <div class="prompt-card" onclick="sendQuick('Necesito un momento para recuperar la calma')">
                        Necesito un momento para recuperar la calma
                    </div>
                </div>
            </div>
        </div>

        <!-- INDICADOR DE ESTADO -->
        <div class="typing-indicator" id="typing">Socius está procesando...</div>

        <!-- ÁREA DE ENTRADA -->
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="txt" placeholder="Escribe tu mensaje..." autocomplete="off" onkeydown="if(event.key==='Enter') send()">
                <button class="btn-send" onclick="send()">Enviar</button>
            </div>
            
            <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: #64748b;">
                <span id="sessionInfo">Sesión activa</span>
                <div>
                    <button class="btn-clear" onclick="clearChat()" style="background: none; border: none; color: #64748b; cursor: pointer; margin-right: 10px;">Reiniciar chat</button>
                    <button onclick="endSession()" style="background-color: #fee2e2; color: #dc2626; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Finalizar sesión</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/frontend/js/indexjs.js"></script>
</body>
</html>
